[versions]
agp = "8.12.1"
kotlin = "2.2.0"
compose = "1.9.0"
compose-material3 = "1.3.2"
androidx-activityCompose = "1.10.1"
lifecycleViewmodelKtx = "2.9.2"
coroutinesVersion= "1.10.2"
ktorClient = "3.2.3"
kotlinxDatetime = "0.7.1"
koin = "4.1.0"
sqlDelight = "2.1.0"
composeMultiplatform = "1.8.2"
composeMpp = "1.8.2"
koinCompose = "4.1.0"
kamelImage = "1.0.7"
